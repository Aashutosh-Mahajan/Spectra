[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra"
version = "1.0.4"
description = "Multi-Agent Codebase Audit System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click",
    "rich",
    "python-dotenv>=1.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "langgraph>=0.4.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "gitpython>=3.1.44",
    "markdown>=3.7",
    "xhtml2pdf>=0.2.17",
    "pygments>=2.19.0",
    "streamlit>=1.42.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "tiktoken>=0.9.0",
    "faiss-cpu>=1.7.0",
    "rank_bm25>=0.2.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
spectra = "cli:main"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length handled loosely
    "E701",  # Multiple statements on one line
    "E402",  # Module level import not at top of file
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
